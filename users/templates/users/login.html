{% extends "mailing/base.html" %}
{% block title %}Вход в систему{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white"><h4 class="mb-0">Вход в систему</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'users:password_reset' %}" class="small">Забыли пароль?</a>
                </div>
            </div>
            <div class="card-footer text-center">
                <span class="text-muted">Нет аккаунта?</span> <a href="{% url 'users:register' %}">Регистрация</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
