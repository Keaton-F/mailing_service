{% extends "mailing/base.html" %}
{% block title %}{{ message.subject }}{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header"><h3 class="mb-0">{{ message.subject }}</h3></div>
    <div class="card-body">
        <p class="white-space-pre-line">{{ message.body }}</p>
        <hr>
        <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">К списку</a>
    </div>
</div>
{% endblock %}
