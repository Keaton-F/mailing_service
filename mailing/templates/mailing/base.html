{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'mailing:home' %}">MailingService</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'mailing:home' %}">Главная</a>
            <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
            <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
            <a class="nav-link" href="{% url 'mailing:client_list' %}">Получатели</a>
            <a class="nav-link" href="{% url 'mailing:attempt_list' %}">Попытки</a>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
